services:
  web:
    labels:
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-web-lup.priority=${LUP_PRODUCTION_TRAEFIK_PRIORITY:-1000}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-games-home.priority=${LUP_PRODUCTION_GAMES_REDIRECT_PRIORITY:-10001}
  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Production object storage requires MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Production object storage requires MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: ""
    networks: !override
      default:
        aliases:
          - mercantec-tech-minio
    labels: !override
      traefik.enable: "false"
    ports: !reset []
  minio-init:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Production object storage requires MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Production object storage requires MINIO_ROOT_PASSWORD}
  api:
    environment:
      ObjectStorage__Endpoint: http://mercantec-tech-minio:9000
      ObjectStorage__AccessKey: ${MINIO_ROOT_USER:?Production object storage requires MINIO_ROOT_USER}
      ObjectStorage__SecretKey: ${MINIO_ROOT_PASSWORD:?Production object storage requires MINIO_ROOT_PASSWORD}
      ObjectStorage__PublicBaseUrl: ""
  previews:
    environment:
      ObjectStorage__AccessKey: ${MINIO_ROOT_USER:?Production object storage requires MINIO_ROOT_USER}
      ObjectStorage__SecretKey: ${MINIO_ROOT_PASSWORD:?Production object storage requires MINIO_ROOT_PASSWORD}

networks:
  default: !override
    external: true
    name: ${LUP_PRIVATE_NETWORK_NAME:-${COMPOSE_PROJECT_NAME}_default}
