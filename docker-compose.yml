# Dokploy: docker compose up -d --build
# Ingen host-ports. Kun Traefik via labels.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.lup.rule=Host(`lup.dk`) || Host(`www.lup.dk`)
      - traefik.http.routers.lup.entrypoints=web
      - traefik.http.routers.lup.service=lup
      - traefik.http.services.lup.loadbalancer.server.port=3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  default:
    name: dokploy-network
    external: true
