<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="LUP — Lokale undervisningsplaner for MAGS hovedforløb H1–H6 på Mercantec."
    />
    <title>LUP · Lokale undervisningsplaner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=15" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <header class="top">
      <a class="logo" href="#/" data-nav="home">
        <span class="logo-mark">LUP</span>
        <span class="logo-text">
          <strong>Lokale undervisningsplaner</strong>
          <small>MAGS · Mercantec</small>
        </span>
      </a>
      <nav class="top-nav" aria-label="Hovedforløb">
        <a href="#/h1" data-nav="h1">H1</a>
        <a href="#/h2" data-nav="h2">H2</a>
        <a href="#/h3" data-nav="h3">H3</a>
        <a href="#/h4" data-nav="h4">H4</a>
        <a href="#/h5" data-nav="h5">H5</a>
        <a href="#/h6" data-nav="h6">H6</a>
        <a href="#/praktik" data-nav="praktik">Praktik</a>
      </nav>
    </header>

    <main>
      <section id="home-view" class="home tidslinje-page" aria-labelledby="brand">
        <header class="home-head">
          <p class="eyebrow">Mercantec · Data &amp; IT</p>
          <h1 class="brand" id="brand">
            <span class="brand-letter">L</span>okale
            <span class="brand-letter">U</span>ndervisnings<span class="brand-letter">P</span>lan
          </h1>
        </header>
        <div class="tl-layout">
          <ol class="tl-track" id="tidslinje-track" aria-label="Tidslinje for uddannelsen"></ol>
          <aside class="tl-rail-shell" aria-label="Tidslinje-navigation">
            <button type="button" class="tl-rail-arrow" id="tl-rail-up" aria-label="Forrige sektion">
              ↑
            </button>
            <nav class="tl-rail" id="tidslinje-rail" aria-label="Hop i tidslinjen"></nav>
            <button type="button" class="tl-rail-arrow" id="tl-rail-down" aria-label="Næste sektion">
              ↓
            </button>
          </aside>
        </div>
      </section>

      <section id="detail-view" class="detail" hidden>
        <a class="back" href="#/">← Tidslinje</a>
        <header class="detail-head">
          <p class="detail-code" id="detail-code"></p>
          <h1 class="detail-title" id="detail-title"></h1>
          <p class="detail-lead" id="detail-lead"></p>
        </header>
        <article class="prose" id="detail-body"></article>
      </section>

      <section id="praktik-view" class="detail" hidden>
        <a class="back" href="#/">← Tidslinje</a>
        <header class="detail-head">
          <p class="detail-code">Praktik</p>
          <h1 class="detail-title" id="praktik-title"></h1>
          <p class="detail-lead" id="praktik-lead"></p>
        </header>
        <article class="prose prose-wide" id="praktik-body"></article>
      </section>
    </main>

    <footer class="foot">
      <p>MAGS · Mercantec · <a href="https://lup.dk">lup.dk</a></p>
    </footer>

    <script type="module" src="js/main.js?v=15"></script>
  </body>
</html>
