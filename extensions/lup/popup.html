<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LUP til Chrome</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body class="popup">
<main class="popup-shell">
  <header class="popup-header">
    <a class="popup-brand" href="https://lup.dk/" target="_blank" rel="noopener noreferrer" aria-label="Åbn LUP.dk">
      <span class="popup-mark"><img src="assets/branding/pixel-lup.svg" width="23" height="23" alt=""></span>
      <h1>LUP til Chrome</h1>
    </a>
    <span class="popup-connection" id="connection-badge">
      <span class="status-orb" aria-hidden="true"></span><span id="connection-label">Tjekker forbindelse</span>
    </span>
  </header>

  <section class="dashboard-card calendar-card" aria-labelledby="calendar-title">
    <div class="dashboard-heading">
      <div class="feature-title">
        <span class="feature-icon calendar-icon" aria-hidden="true"></span>
        <h2 id="calendar-title">Min kalender</h2>
      </div>
      <a class="dashboard-link external-link" href="https://lup.dk/teacher/planner" target="_blank" rel="noopener noreferrer">Åbn i LUP</a>
    </div>
    <div id="calendar-gate" class="calendar-gate" role="status">
      <p id="calendar-gate-message">Tjekker, om kalenderen er tilgængelig…</p>
      <a id="calendar-access-link" class="dashboard-link" href="https://lup.dk/extension" target="_blank" rel="noopener noreferrer" hidden>Opret nøgle med kalenderadgang <span aria-hidden="true">↗</span></a>
    </div>
    <div id="calendar-overview" hidden>
      <div class="week-toolbar">
        <span id="calendar-week"></span>
        <div class="week-actions">
          <button id="calendar-today" class="today-button" type="button">I dag</button>
          <button id="calendar-prev" class="week-button" type="button" aria-label="Forrige uge"><img src="assets/icons/chevron-left.svg" alt=""></button>
          <button id="calendar-next" class="week-button" type="button" aria-label="Næste uge"><img src="assets/icons/chevron-left.svg" alt=""></button>
        </div>
      </div>
      <div id="calendar-days" class="calendar-days" role="group" aria-label="Vælg dag i ugen"></div>
      <div class="agenda">
        <h3 id="calendar-date" tabindex="-1"></h3>
        <p id="calendar-status" role="status"></p>
        <button id="calendar-retry" class="dashboard-link" type="button" hidden>Prøv igen</button>
        <ul id="calendar-events" class="calendar-events" aria-labelledby="calendar-date" tabindex="0" hidden></ul>
        <p id="calendar-note" class="calendar-note" hidden></p>
      </div>
    </div>
  </section>

  <section class="dashboard-card emoji-card" aria-labelledby="emoji-title">
    <div class="dashboard-heading">
      <div class="feature-title">
        <span class="feature-icon emoji-icon" aria-hidden="true"></span>
        <h2 id="emoji-title">Emojiværksted</h2>
      </div>
      <a class="dashboard-link external-link" href="https://lup.dk/emojis" target="_blank" rel="noopener noreferrer">Bibliotek</a>
    </div>
    <form class="popup-image-search" action="search.html" method="get" target="_blank">
      <label class="visually-hidden" for="image-query">Søg efter billeder</label>
      <input id="image-query" name="q" type="search" minlength="2" maxlength="100" placeholder="Find billeder eller GIF’er" required autocomplete="off">
      <button class="gif-shortcut" type="submit" name="mode" value="gifs" formnovalidate aria-label="Søg efter GIF’er">GIF</button>
      <button class="search-button" type="submit" aria-label="Søg efter billeder"><img src="assets/icons/search.svg" alt=""></button>
    </form>
    <p class="context-hint">Du kan også højreklikke på et billede for at lave en emoji.</p>
  </section>

  <details id="connection-settings" class="connection-settings">
    <summary>
      <span class="settings-icon" aria-hidden="true"></span>
      <span id="connection-summary">Forbind udvidelsen</span>
    </summary>
    <div class="settings-body">
      <p id="connection" role="status"></p>
      <a class="dashboard-link external-link" href="https://lup.dk/extension" target="_blank" rel="noopener noreferrer">Administrer nøgler på LUP.dk</a>
      <form id="access-form">
        <label class="field-label" for="access-key">Personlig LUP-nøgle</label>
        <input id="access-key" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Indsæt din nøgle" maxlength="60" required>
        <button type="submit" id="connect" class="primary-button">Forbind LUP</button>
      </form>
      <p id="access-error" class="feedback error" role="alert" hidden></p>
      <button type="button" id="disconnect" class="text-button danger" hidden>Glem forbindelse på denne computer</button>
    </div>
  </details>
</main>
<script type="module" src="popup.mjs"></script>
</body>
</html>
