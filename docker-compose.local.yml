# Lokal udvikling uden Dokploy-netværk:
# docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
services:
  collaboration:
    environment:
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
  web:
    networks:
      dokploy-network: !reset null
    ports:
      - "3000:3000"
  api:
    networks:
      home-runner-control: !reset null
    volumes:
      - type: tmpfs
        target: /run/lup-home-game
    environment:
      Rost__Enabled: ${ROST_ENABLED:-true}
      Rost__BaseUrl: ${ROST_BASE_URL:-http://host.docker.internal:8091}
      Rost__TimeoutSeconds: 30
      Cors__SpaOrigins: http://localhost:3000;http://127.0.0.1:3000;http://localhost:5253;http://127.0.0.1:5253
      ObjectStorage__PublicBaseUrl: ${OBJECT_STORAGE_PUBLIC_BASE_URL:-http://127.0.0.1:9000}
    ports:
      - "8080:8080"
  minio:
    networks:
      dokploy-network: !reset null
    environment:
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-http://127.0.0.1:9001}
    ports:
      - "9000:9000"
      - "9001:9001"

networks:
  default:
    ipam:
      config: !override
        - subnet: ${LUP_PRIVATE_SUBNET:-}
  dokploy-network: !reset null
  home-runner-control: !reset null

volumes:
  lup-home-game-connection: !reset null
